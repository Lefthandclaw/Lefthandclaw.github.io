<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>README-näkymä</title>
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 2em auto;
      padding: 1em;
      line-height: 1.6;
      background: #f9f9f9;
      color: #333;
    }
    pre {
      background: #eee;
      padding: 1em;
      overflow-x: auto;
    }
    code {
      background: #e0e0e0;
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>yksil-projekti README</h1>
  <div id="readme">Ladataan README.md...</div>

  <script>
    fetch('https://raw.githubusercontent.com/Lefthandclaw/yksil-projekti/main/README.md')
      .then(response => {
        if (!response.ok) throw new Error("README.md ei löytynyt");
        return response.text();
      })
      .then(markdown => {
        const converter = new showdown.Converter();
        const html = converter.makeHtml(markdown);
        document.getElementById('readme').innerHTML = html;
      })
      .catch(error => {
        document.getElementById('readme').innerHTML = "Virhe ladattaessa README.md-tiedostoa.";
        console.error(error);
      });
  </script>
</body>
</html>
